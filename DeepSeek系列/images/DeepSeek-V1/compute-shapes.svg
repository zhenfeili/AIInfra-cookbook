<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img">
<title>MHA 的张量形状与每 token 训练计算量；教学推导</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#546778"/></marker></defs>
<rect width="1000" height="660" fill="white"/>
<text x="500" y="36" text-anchor="middle" font-size="25" font-weight="600" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">先算单层前向，再折算成每 token 训练 FLOPs</text>
<text x="500" y="67" text-anchor="middle" font-size="18" font-weight="400" fill="#546778" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">行向量约定 · 输入 X：[S,d] · m = 8d/3 · H×dₕ = d · 1 次乘加 = 2 FLOPs</text>
<text x="28" y="110" text-anchor="start" font-size="21" font-weight="600" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">① 参数相关的线性投影</text>
<rect x="30" y="130" width="180" height="72" rx="8" fill="#eef4fb" stroke="#c8d4df"/>
<text x="120.0" y="158.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">输入 X</text>
<text x="120.0" y="187.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">[S,d]</text>
<rect x="265" y="130" width="360" height="72" rx="8" fill="#eef4fb" stroke="#c8d4df"/>
<text x="445.0" y="158.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">Q、K、V、输出投影</text>
<text x="445.0" y="187.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">4 个 [d,d] 权重</text>
<rect x="685" y="130" width="280" height="72" rx="8" fill="#eaf5f0" stroke="#c8d4df"/>
<text x="825.0" y="158.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">4 × 2Sd²</text>
<text x="825.0" y="187.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">= 8Sd² FLOPs</text>
<polyline points="210,166 265,166" fill="none" stroke="#546778" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="625,166 685,166" fill="none" stroke="#546778" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30" y="225" width="180" height="72" rx="8" fill="#eef4fb" stroke="#c8d4df"/>
<text x="120.0" y="253.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">输入 X</text>
<text x="120.0" y="282.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">[S,d]</text>
<rect x="265" y="225" width="360" height="72" rx="8" fill="#eef4fb" stroke="#c8d4df"/>
<text x="445.0" y="253.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">SwiGLU：两条上投影 + 下投影</text>
<text x="445.0" y="282.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">[S,d] → 两个 [S,m] → [S,d]</text>
<rect x="685" y="225" width="280" height="72" rx="8" fill="#eaf5f0" stroke="#c8d4df"/>
<text x="825.0" y="253.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">3 × 2Sdm</text>
<text x="825.0" y="282.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">= 16Sd² FLOPs</text>
<polyline points="210,261 265,261" fill="none" stroke="#546778" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="625,261 685,261" fill="none" stroke="#546778" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="28" y="340" text-anchor="start" font-size="21" font-weight="600" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">② 不增加参数、但消耗算力的注意力交互</text>
<rect x="30" y="365" width="270" height="85" rx="8" fill="#eef4fb" stroke="#c8d4df"/>
<text x="165.0" y="400.0" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">单头 QKᵀ</text>
<text x="165.0" y="429.0" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">[S,dₕ] × [dₕ,S] → [S,S]</text>
<rect x="365" y="365" width="300" height="85" rx="8" fill="#eef4fb" stroke="#c8d4df"/>
<text x="515.0" y="400.0" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">softmax 后乘 V</text>
<text x="515.0" y="429.0" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">[S,S] × [S,dₕ] → [S,dₕ]</text>
<rect x="725" y="365" width="240" height="85" rx="8" fill="#fff2e7" stroke="#c8d4df"/>
<text x="845.0" y="400.0" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">两次乘法，H 个头</text>
<text x="845.0" y="429.0" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">4S²d FLOPs</text>
<polyline points="300,407 365,407" fill="none" stroke="#546778" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="665,407 725,407" fill="none" stroke="#546778" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30" y="490" width="935" height="100" rx="8" fill="#eaf5f0" stroke="#c8d4df"/>
<text x="497.5" y="531.75" text-anchor="middle" font-size="22" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">单层前向：24Sd² + 4S²d</text>
<text x="497.5" y="563.65" text-anchor="middle" font-size="22" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">× 约 3（前向 + 反向）× L 层 ÷ S token  →  M = 72Ld² + 12LdS</text>
<text x="500" y="625" text-anchor="middle" font-size="18" font-weight="400" fill="#546778" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">式 (2) 的 MHA 计数口径；省略词表、归一化等开销，不直接作为 67B GQA 的精确算量。</text>
</svg>