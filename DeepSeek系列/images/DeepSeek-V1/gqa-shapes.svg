<text x="500" y="312" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">展开第 0 组：每个头独立打分和输出，共享同一份 K₀、V₀</text>
