<text x="500" y="576" text-anchor="middle" font-size="18" font-weight="400" fill="#546778" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">组 g 服务 Q 头 8g … 8g+7；组内箭头表示读取 K/V，K/V 无需物理复制 8 份。</text>
