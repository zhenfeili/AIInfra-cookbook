<text x="245.0" y="241.5" text-anchor="middle" font-size="20" font-weight="400" fill="#183049" font-family="Arial Unicode MS, Noto Sans CJK SC, PingFang SC, sans-serif">Q：[S,8192] → [S,64,128]</text>
